name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Ssabba.slnx

      - name: Build
        run: dotnet build Ssabba.slnx --configuration Release --no-restore

      # Split so a failure names the tier. The runner has Docker, so both tiers run here; a
      # contributor without a container runtime can still run the first one.
      - name: Test (unit)
        run: dotnet test Ssabba.slnx --configuration Release --no-build --filter "Category!=Integration" --logger "trx;LogFileName=unit.trx"

      - name: Test (integration)
        run: dotnet test Ssabba.slnx --configuration Release --no-build --filter "Category=Integration" --logger "trx;LogFileName=integration.trx"

      - name: Format
        run: dotnet format Ssabba.slnx --verify-no-changes --no-restore

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Validate the Compose stack
        working-directory: deploy
        run: |
          cp .env.example .env
          docker compose -f compose.yaml config >/dev/null
          docker compose config >/dev/null

      - name: Build images
        run: |
          docker build -f src/Ssabba.Web/Dockerfile -t ssabba-web:ci .
          docker build -t ssabba-docs:ci docs
