name: ssabba

services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --configFile=/etc/traefik/traefik.yaml
    environment:
      # Traefik's static config takes no templates; TRAEFIK_* env vars override it instead.
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL: ${ACME_EMAIL}
      CROWDSEC_LAPI_KEY: ${CROWDSEC_LAPI_KEY}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik-acme:/acme
      - traefik-logs:/var/log/traefik
    networks:
      edge:
        # Containers resolve the public hostname to Traefik, so the app can reach
        # Keycloak's issuer URL by the same name the browser uses.
        aliases:
          - ${APP_DOMAIN}
    depends_on:
      crowdsec:
        condition: service_started

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    restart: unless-stopped
    environment:
      COLLECTIONS: "crowdsecurity/traefik crowdsecurity/base-http-scenarios"
      BOUNCER_KEY_traefik: ${CROWDSEC_LAPI_KEY}
    volumes:
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - crowdsec-db:/var/lib/crowdsec/data
      - crowdsec-config:/etc/crowdsec
      - traefik-logs:/var/log/traefik:ro
    networks: [edge]

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_DB: ${KEYCLOAK_DB}
    volumes:
      # Postgres 18 wants the mount one level up so pg_upgrade --link stays possible.
      - db-data:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start", "--import-realm", "--http-enabled=true", "--proxy-headers=xforwarded"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/${KEYCLOAK_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: https://${APP_DOMAIN}/auth
      KC_HTTP_RELATIVE_PATH: /auth
      SSABBA_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      SSABBA_REDIRECT_URI: https://${APP_DOMAIN}/*
      # Extra redirect URI, used by the development override; harmless in production.
      SSABBA_DEV_REDIRECT_URI: ${DEV_REDIRECT_URI:-https://${APP_DOMAIN}/*}
    volumes:
      - ./keycloak/ssabba-realm.json:/opt/keycloak/data/import/ssabba-realm.json:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [edge, internal]
    labels:
      traefik.enable: "true"
      traefik.http.routers.keycloak.rule: Host(`${APP_DOMAIN}`) && PathPrefix(`/auth`)
      traefik.http.routers.keycloak.entrypoints: websecure
      traefik.http.routers.keycloak.tls.certresolver: letsencrypt
      traefik.http.services.keycloak.loadbalancer.server.port: "8080"

  web:
    build:
      context: ..
      dockerfile: src/Ssabba.Web/Dockerfile
    image: ghcr.io/${GITHUB_OWNER:-ssabba}/ssabba-web:${SSABBA_VERSION:-latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Ssabba: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      # Public issuer URL: it must match what the browser is redirected to, so the app
      # resolves Keycloak through Traefik rather than over the internal network.
      Oidc__Authority: https://${APP_DOMAIN}/auth/realms/ssabba
      Oidc__ClientId: ssabba-web
      Oidc__ClientSecret: ${OIDC_CLIENT_SECRET}
      Oidc__RequireHttpsMetadata: "${OIDC_REQUIRE_HTTPS_METADATA:-true}"
      DataProtection__KeyPath: /keys
    volumes:
      - web-keys:/keys
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks: [edge, internal]
    labels:
      traefik.enable: "true"
      traefik.http.routers.ssabba.rule: Host(`${APP_DOMAIN}`)
      traefik.http.routers.ssabba.entrypoints: websecure
      traefik.http.routers.ssabba.tls.certresolver: letsencrypt
      traefik.http.services.ssabba.loadbalancer.server.port: "8080"

  docs:
    build:
      context: ../docs
    image: ghcr.io/${GITHUB_OWNER:-ssabba}/ssabba-docs:${SSABBA_VERSION:-latest}
    restart: unless-stopped
    networks: [edge]
    labels:
      traefik.enable: "true"
      traefik.http.routers.docs.rule: Host(`${APP_DOMAIN}`) && PathPrefix(`/docs`)
      traefik.http.routers.docs.entrypoints: websecure
      traefik.http.routers.docs.tls.certresolver: letsencrypt
      traefik.http.services.docs.loadbalancer.server.port: "8080"

  loki:
    image: grafana/loki:3.7.6
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    networks: [internal]

  promtail:
    image: grafana/promtail:3.3.2
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail.yaml
    volumes:
      - ./promtail/promtail.yaml:/etc/promtail/promtail.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on: [loki]
    networks: [internal]

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://${APP_DOMAIN}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on: [loki]
    networks: [edge, internal]
    labels:
      traefik.enable: "true"
      traefik.http.routers.grafana.rule: Host(`${APP_DOMAIN}`) && PathPrefix(`/grafana`)
      traefik.http.routers.grafana.entrypoints: websecure
      traefik.http.routers.grafana.tls.certresolver: letsencrypt
      traefik.http.services.grafana.loadbalancer.server.port: "3000"

networks:
  edge:
  internal:
    internal: true

volumes:
  db-data:
  web-keys:
  loki-data:
  grafana-data:
  crowdsec-db:
  crowdsec-config:
  traefik-acme:
  traefik-logs:
